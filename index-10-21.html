<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            /* 枠線と、外余白を含んだサイズをwidthで指定する */
            box-sizing: border-box;
            margin: 0;
            border: solid 1px gray;
        }
        header{
            width: 100%;
            height: 10vh;
            background-color: antiquewhite;
        }
        nav{
            width: 100%;
            height: 10vh;
            background-color: rgb(208, 241, 253);
        }

        main{
            width: 100%;
            height: 70vh;
            background-color: rgb(241, 211, 215);
        }
        footer{
            width: 100%;
            height: 10vh;
            background-color: rgb(223, 252, 194);
        }
        main #sec2{
            /* background-color: red; */

            /* 要素を非表示に設定する */
            display: none;
            /*  非表示：　none
                表示　：　block
            */
        }

    </style>
    <script>
        // 動きのある動作は、JavaScriptを使う
        function showPage2(){
            alert( "page2 がクリックされました。");
            // 要素sec2を選択する
            var item = document.getElementById("sec2");
            // 要素sec2を表示設定（block）にする
            item.style.display="block";
            var item = document.getElementById( "sec1");
            item.style.display = "none";
        }
        function shwoPage1(){
            alert( "page1がクリックされました");
            var item = document.getElementById( "sec1");
            item.style.display= "block";
            var item = document.getElementById( "sec2");
            item.style.display="none";
        }
    </script>
</head>
<body>
    <header> this is header. </header>
    <nav>
        <div onclick="shwoPage1()">page.1</div>
        <div onclick="showPage2()">page.2</div>
    </nav>
    <main>
        <section id="sec1" class="secGroup">
            Webフロントの授業について説明します。
        </section>
        <section id="sec2" class="secGroup">
            JavaScriptの授業について説明します。
        </section>

    </main>
    <footer>
        this is footer.
    </footer>
</body>

</html>
