<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       *{
        /*枠線と、外余白を含んだサイズをwidthで指定する*/
        box-sizing: border-box;
        margin: 0;
        border: solid 1px gray;
        }
        header{
            width: 100%;
            height: 10vh;
            background-color: antiquewhite;
        }
        nav{
            width: 100%;
            height: 10vh;
            background-color: rgb(80, 217, 255);
        }
        main{
            width: 100%;
            height: 70vh;
            background-color: lightpink;
        }
        footer{
            width: 100%;
            height: 10vh;
            background-color: lightgreen;
        }
        main #sec2{
            /*background-color: brown;*/

            /*要素を非表示に設定する:*/
            display: none;
            /*非表示：none
              表示　：block
            */
        }
    </style>
</head>
<body>
    <header>this is header.</header>
    <nav>
        <div onclick="">page.1</div>
        <div onclick="">page.2</div>
    </nav>
    <main>
        <section id="sec1">
            Webフロントの授業について説明します。
        </section>
        <section id="sec2">
            JavaScriptの授業について説明します。
        </section>
        <footer>
            this is footer.
        </footer>
        
    </main>
</body>
</html>
